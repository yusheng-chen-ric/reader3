<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Flashcards</title>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; }

        /* Header */
        header { background: white; border-bottom: 1px solid #e9ecef; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 24px; color: #333; }
        .nav-link { color: #3498db; text-decoration: none; font-size: 14px; }
        .nav-link:hover { text-decoration: underline; }

        /* Container */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 40px; }

        /* Deck Selector */
        .deck-selector { background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .deck-selector label { font-weight: bold; color: #333; }
        .deck-selector select { flex: 1; padding: 10px; border: 1px solid #e9ecef; border-radius: 4px; font-size: 14px; }

        /* Cards List */
        .cards-list { background: white; border-radius: 8px; overflow: hidden; }

        .card-item { padding: 20px; border-bottom: 1px solid #e9ecef; transition: background 0.2s; }
        .card-item:last-child { border-bottom: none; }
        .card-item:hover { background: #f8f9fa; }

        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }

        .card-question { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .card-answer { font-size: 14px; color: #6c757d; line-height: 1.6; }

        .card-meta { font-size: 12px; color: #6c757d; margin-top: 10px; }
        .card-meta span { margin-right: 15px; }

        .card-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 8px; }
        .card-badge.new { background: #e3f2fd; color: #1976d2; }
        .card-badge.learning { background: #fff3e0; color: #f57c00; }
        .card-badge.review { background: #e8f5e9; color: #388e3c; }
        .card-badge.due { background: #ffebee; color: #c62828; }

        .card-actions { display: flex; gap: 10px; }
        .btn-small { padding: 6px 12px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-edit { background: #e9ecef; color: #495057; }
        .btn-edit:hover { background: #dee2e6; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-delete:hover { background: #c0392b; }

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
        .empty-state h2 { font-size: 20px; margin-bottom: 10px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }

        .modal-content { background: white; border-radius: 8px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-header { font-size: 20px; font-weight: bold; margin-bottom: 20px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #e9ecef; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 100px; }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-secondary { background: #e9ecef; color: #495057; }
        .btn-secondary:hover { background: #dee2e6; }

        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>
    <header>
        <h1>Manage Flashcards</h1>
        <a href="/decks" class="nav-link">← Back to Decks</a>
    </header>

    <div class="container">
        <div class="deck-selector">
            <label for="deck-select">Deck:</label>
            <select id="deck-select" onchange="loadCards()">
                <option value="">All Decks</option>
                {% for deck in decks %}
                <option value="{{ deck.id }}">{{ deck.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="cards-list" id="cards-list">
            <div class="empty-state">
                <h2>Select a deck to view cards</h2>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">Edit Flashcard</div>
            <form id="edit-form" onsubmit="saveCard(event)">
                <div class="form-group">
                    <label>Front (Question):</label>
                    <textarea id="edit-front" required></textarea>
                </div>
                <div class="form-group">
                    <label>Back (Answer):</label>
                    <textarea id="edit-back" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentCardId = null;

        async function loadCards() {
            const deckId = document.getElementById('deck-select').value;
            const list = document.getElementById('cards-list');

            if (!deckId) {
                list.innerHTML = '<div class="empty-state"><h2>Select a deck to view cards</h2></div>';
                return;
            }

            list.innerHTML = '<div class="empty-state"><h2>Loading...</h2></div>';

            try {
                const response = await fetch(`/api/decks/${deckId}/cards`);
                const data = await response.json();

                if (data.cards.length === 0) {
                    list.innerHTML = '<div class="empty-state"><h2>No cards in this deck yet</h2><p>Start reading and create flashcards!</p></div>';
                    return;
                }

                list.innerHTML = '';

                data.cards.forEach(card => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card-item';

                    // Determine card state
                    let badgeClass = 'review';
                    let badgeText = 'Review';

                    if (card.repetitions === 0) {
                        badgeClass = 'new';
                        badgeText = 'New';
                    } else if (card.repetitions < 3) {
                        badgeClass = 'learning';
                        badgeText = 'Learning';
                    }

                    if (card.is_due) {
                        badgeClass = 'due';
                        badgeText = 'Due';
                    }

                    const nextReview = new Date(card.next_review).toLocaleDateString();

                    cardDiv.innerHTML = `
                        <div class="card-header">
                            <div style="flex: 1;">
                                <span class="card-badge ${badgeClass}">${badgeText}</span>
                                <div class="card-question">${escapeHtml(card.front)}</div>
                                <div class="card-answer">${escapeHtml(card.back)}</div>
                                <div class="card-meta">
                                    <span>Reviews: ${card.total_reviews}</span>
                                    <span>Interval: ${card.interval}d</span>
                                    <span>Ease: ${card.ease_factor.toFixed(2)}</span>
                                    <span>Next: ${nextReview}</span>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-small btn-edit" onclick="editCard(${card.id}, '${escapeAttr(card.front)}', '${escapeAttr(card.back)}')">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteCard(${card.id})">Delete</button>
                            </div>
                        </div>
                    `;

                    list.appendChild(cardDiv);
                });
            } catch (error) {
                list.innerHTML = '<div class="empty-state"><h2>Error loading cards</h2><p>' + error.message + '</p></div>';
            }
        }

        function editCard(id, front, back) {
            currentCardId = id;
            document.getElementById('edit-front').value = front;
            document.getElementById('edit-back').value = back;
            document.getElementById('edit-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.remove('show');
            currentCardId = null;
        }

        async function saveCard(event) {
            event.preventDefault();

            const front = document.getElementById('edit-front').value;
            const back = document.getElementById('edit-back').value;

            const form = document.getElementById('edit-form');
            form.classList.add('loading');

            try {
                const response = await fetch(`/api/cards/${currentCardId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ front, back })
                });

                const data = await response.json();

                if (data.success) {
                    closeModal();
                    loadCards();
                } else {
                    alert('Error saving card');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                form.classList.remove('loading');
            }
        }

        async function deleteCard(id) {
            if (!confirm('Are you sure you want to delete this flashcard?')) {
                return;
            }

            try {
                const response = await fetch(`/api/cards/${id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    loadCards();
                } else {
                    alert('Error deleting card');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Close modal when clicking outside
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
