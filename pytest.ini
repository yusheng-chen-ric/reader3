[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Coverage settings
addopts =
    --verbose
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-exclude-lines="pragma: no cover"
    --cov-exclude-lines="if __name__ == .__main__.:"
    --cov-exclude-lines="if TYPE_CHECKING:"

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for API endpoints
    ai: Tests requiring AI provider (may cost money)
    slow: Slow running tests
